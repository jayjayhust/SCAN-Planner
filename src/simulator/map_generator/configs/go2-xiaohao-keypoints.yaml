# Xiaohao multi-floor tour (navi_mode:=2, PRESET_TARGET) - floor 1 -> stair descent -> floor 2.
#
# VERIFIED GREEN: with the repaired stairwell map (maps/goslam_xiaohao_hq_indoor_multi_0.1m_carved.pcd)
# this 42-waypoint tour runs end-to-end in open_loop sim at the REAL Go2 footprint
# (double_cylinder_radius 0.25, obstacles_inflation_z_up 0.1, z_down 0.4): the robot descends the
# full staircase (z 0.00 -> -3.72) and finishes stationary at W42 (-14.94, -7.40, -3.72).
#
# The tour relies on THREE fixes (see the important_decision memory for the full diagnosis):
#  1. MAP WIDTH - the raw GoSLAM scan compresses the stairwell to 0.22-0.40 m free (< the 0.50 m the
#     0.31 m body needs), so the map was repaired by carving a ~1.1 m corridor around the descent
#     centreline -> ..._carved.pcd. run_goslam_multi.launch.py now loads that carved map.
#  2. STAIR WAYPOINT Z (W21-W42) - re-authored at tread+0.35 (measured from the carved PCD) so each
#     goal AND the min-snap ramp between consecutive treads clear the inflated band [tread-0.4,
#     tread+0.1]. W22-W24 are also corridor-centred in X. Floor-1 W1-W20 are left at their authored
#     Z (they traverse reliably; lifting them destabilises the mezzanine underpass).
#  3. FINAL-HOP SPEED - the last W41->W42 gap (~1.06 m) is below max_vel^2/max_acc = 1.125 m, so at
#     the default max_vel 0.75 the short min-snap profile trips the accel ceiling (max_acc 0.5 +
#     acc_tolerance 1.0 = 1.5). The max_vel 0.4 override below gives every hop more time and removes
#     the dynamic-feasibility stall WITHOUT shrinking the footprint. It lives here (loaded after
#     planner.yaml) so the committed planner.yaml stays at upstream defaults.
scan_planner_node:
  ros__parameters:
    manager.max_vel: 0.4
    optimization.max_vel: 0.4
    fsm.waypoints: [2.4, 4.0, 0.7, 2.3, 3.0, 0.6, 2.2, 2.9, 0.6, 1.0, 1.5, 0.5, -0.2, 0.2, 0.3, -0.286, -0.033, 0.3, -0.1, -1.9, 0.3, -0.1, -2.9, 0.3, -0.4, -4.7, 0.2, -0.4, -4.8, 0.2, -0.5, -5.0, 0.2, -0.542, -6.142, 0.2, -2.5, -6.1, 0.2, -4.5, -6.1, 0.2, -6.3, -6.3, 0.2, -6.8, -6.8, 0.3, -8.6, -7.2, 0.2, -10.5, -7.2, 0.2, -12.2, -7.7, 0.2, -13.611, -8.0, 0.2, -13.566, -9.072, 0.176, -13.32, -9.689, 0.103, -13.29, -10.306, -0.073, -13.31, -10.923, -0.35, -13.462, -11.54, -0.682, -13.517, -12.579, -1.15, -13.544, -13.107, -1.3, -13.572, -13.635, -1.4, -13.6, -14.163, -1.376, -13.7, -14.1, -1.376, -14.1, -14.1, -1.376, -14.214, -14.176, -1.376, -14.413, -13.158, -1.743, -14.529, -12.566, -1.948, -14.645, -11.975, -2.161, -14.761, -11.383, -2.5, -14.808, -10.338, -2.842, -14.835, -9.752, -3.033, -14.861, -9.165, -3.225, -14.888, -8.578, -3.417, -14.914, -7.991, -3.525, -14.941, -7.404, -3.72]
